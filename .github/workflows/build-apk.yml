name: Build HMGS Arena APK

on:
  push:
    branches: [apk-demo-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve HMGS source
        run: |
          cp lib/main.dart /tmp/hmgs_main.dart
          cp pubspec.yaml /tmp/hmgs_pubspec.yaml

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org com.zorbirey.hmgsarena --project-name hmgs_arena
          cp /tmp/hmgs_main.dart lib/main.dart
          cp /tmp/hmgs_pubspec.yaml pubspec.yaml

      - name: Decode branding assets
        run: |
          mkdir -p assets/branding
          base64 -d assets/branding/splash_arena.b64 > assets/branding/splash_arena.jpg
          base64 -d assets/branding/inspired_from_zeus.b64 > assets/branding/inspired_from_zeus.jpg
          base64 -d assets/branding/app_icon.b64 > assets/branding/app_icon.jpg

      - name: Install packages
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Set Android app label
        run: |
          sed -i 's/android:label="hmgs_arena"/android:label="HMGS ARENA"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HMGS-ARENA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HMGS-ARENA-DEMO.apk
          gh release delete apk-demo-v1 --yes --cleanup-tag || true
          gh release create apk-demo-v1 HMGS-ARENA-DEMO.apk \
            --title "HMGS ARENA Android Demo" \
            --notes "Android demo build. 3-second Arena splash, 3-second Zeus signature screen, no-scroll home, XP/level titles, ranking preview, neutral quiz answering, post-test results and wrong-answer review."

      - name: Write build success marker
        run: |
          printf '%s\n' \
            'HMGS ARENA APK build completed successfully.' \
            'Download: https://github.com/zorbirey/hmgs-arena/releases/download/apk-demo-v1/HMGS-ARENA-DEMO.apk' \
            "Commit: $GITHUB_SHA" > BUILD_SUCCESS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_SUCCESS.txt
          git commit -m '[skip build] Record successful APK build'
          git push origin HEAD:apk-demo-v1
