name: Build HMGS Arena APK

on:
  push:
    branches: [apk-demo-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve HMGS source
        run: |
          cp lib/main.dart /tmp/hmgs_main.dart
          cp pubspec.yaml /tmp/hmgs_pubspec.yaml

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org com.zorbirey.hmgsarena --project-name hmgs_arena
          cp /tmp/hmgs_main.dart lib/main.dart
          cp /tmp/hmgs_pubspec.yaml pubspec.yaml

      - name: Decode branding assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          root = Path('assets/branding')
          root.mkdir(parents=True, exist_ok=True)
          for stem in ['splash_arena', 'inspired_from_zeus', 'app_icon']:
              src = root / f'{stem}.b64'
              dst = root / f'{stem}.jpg'
              raw = src.read_text(encoding='utf-8', errors='ignore')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              clean = clean.rstrip('=')
              clean += '=' * ((4 - len(clean) % 4) % 4)
              data = base64.b64decode(clean, validate=False)
              if not data.startswith(b'\xff\xd8'):
                  raise SystemExit(f'{stem}: decoded data is not JPEG')
              dst.write_bytes(data)
              print(stem, len(data), 'bytes')
          PY
          file assets/branding/*.jpg

      - name: Install packages
        run: flutter pub get

      - name: Set Android app label
        run: |
          sed -i 's/android:label="hmgs_arena"/android:label="HMGS ARENA"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HMGS-ARENA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HMGS-ARENA-DEMO.apk
          gh release delete apk-demo-v1 --yes --cleanup-tag || true
          gh release create apk-demo-v1 HMGS-ARENA-DEMO.apk \
            --title "HMGS ARENA Android Demo" \
            --notes "Android demo build for HMGS ARENA."
