name: Build HMGS Arena APK

on:
  push:
    branches: [apk-demo-v1, smart-notes-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve HMGS source
        run: |
          cp lib/main.dart /tmp/hmgs_main.dart
          cp lib/smart_main.dart /tmp/hmgs_smart_main.dart
          cp lib/smart_notes.dart /tmp/hmgs_smart_notes.dart
          cp pubspec.yaml /tmp/hmgs_pubspec.yaml

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org com.zorbirey.hmgsarena --project-name hmgs_arena
          cp /tmp/hmgs_main.dart lib/main.dart
          cp /tmp/hmgs_smart_main.dart lib/smart_main.dart
          cp /tmp/hmgs_smart_notes.dart lib/smart_notes.dart
          cp /tmp/hmgs_pubspec.yaml pubspec.yaml

      - name: Decode Zeus signature asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          root = Path('assets/branding')
          src = root / 'inspired_from_zeus.b64'
          dst = root / 'inspired_from_zeus.jpg'
          raw = src.read_text(encoding='utf-8', errors='ignore')
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw).rstrip('=')
          clean += '=' * ((4 - len(clean) % 4) % 4)
          data = base64.b64decode(clean, validate=False)
          if not data.startswith(b'\xff\xd8'):
              raise SystemExit('Zeus asset did not decode as JPEG')
          dst.write_bytes(data)
          print('Zeus asset:', len(data), 'bytes')
          PY

      - name: Inject 164 verified questions into Arena
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          files = sorted(Path('assets/questions').glob('verified_batch_*.json'))
          questions = []
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              subject = data['subject']
              for q in data['questions']:
                  questions.append({**q, 'subject': subject})

          if len(questions) != 164:
              raise SystemExit(f'Expected 164 verified questions, found {len(questions)}')

          def dstr(value):
              return json.dumps(value, ensure_ascii=False)

          rows = []
          for q in questions:
              options = ', '.join(dstr(x) for x in q['options'])
              rows.append(
                  '  ArenaQuestion('
                  f'subject: {dstr(q["subject"])}, '
                  f'topic: {dstr(q["topic"])}, '
                  f'text: {dstr(q["question"])}, '
                  f'options: <String>[{options}], '
                  f'correct: {q["correctIndex"]}, '
                  f'explanation: {dstr(q["explanation"])})'
              )

          replacement = (
              'final allVerifiedQuestions = <ArenaQuestion>[\n' + ',\n'.join(rows) + '\n];\n\n'
              'final demoQuestions = (List<ArenaQuestion>.from(allVerifiedQuestions)..shuffle()).take(10).toList();\n\n'
              'class ArenaShell'
          )

          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')
          pattern = r'(?:const demoQuestions = <ArenaQuestion>\[.*?\n\];|final allVerifiedQuestions = <ArenaQuestion>\[.*?\n\];\n\nfinal demoQuestions = .*?;)\n\nclass ArenaShell'
          text, n = re.subn(pattern, replacement, text, flags=re.S)
          if n != 1:
              raise SystemExit(f'Question pool replacement count was {n}')

          text = text.replace("subtitle: '133 soruluk havuz · rastgele 10'", "subtitle: '164 soruluk havuz · rastgele 10'")
          text = text.replace("subtitle: '95 soruluk havuz · rastgele 10'", "subtitle: '164 soruluk havuz · rastgele 10'")
          text = text.replace("subtitle: '10 soruluk demo'", "subtitle: '164 soruluk havuz · rastgele 10'")
          text = text.replace("const Text('DEMO TEST'", "const Text('ARENA TESTİ'")
          p.write_text(text, encoding='utf-8')
          print('Injected verified questions:', len(questions))
          PY

      - name: Install packages
        run: flutter pub get

      - name: Set Android app label
        run: |
          sed -i 's/android:label="hmgs_arena"/android:label="HMGS ARENA"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos

      - name: Build Smart Notes release APK
        run: flutter build apk --release -t lib/smart_main.dart

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HMGS-ARENA-SMART-NOTES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HMGS-ARENA-SMART-NOTES.apk
          gh release delete apk-smart-notes --yes --cleanup-tag || true
          gh release create apk-smart-notes HMGS-ARENA-SMART-NOTES.apk \
            --title "HMGS ARENA Akıllı Notlar" \
            --notes "Çalışma sekmesine 30 Akıllı Not, Karıştırılanlar ve Süre-Rakam filtreleri eklendi."
