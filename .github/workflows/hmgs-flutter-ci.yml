name: HMGS Android Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: hmgs-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-build:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ortam bilgisini yazdir
        run: |
          flutter --version
          java -version

      - name: Android platform dosyalarini olustur
        run: |
          flutter create . --platforms=android --project-name hmgs_arena
          rm -f test/widget_test.dart

      - name: HMGS Android marka dosyalarini uygula
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          sed -i 's/android:label="hmgs_arena"/android:label="HMGS ARENA"/' android/app/src/main/AndroidManifest.xml
          rsvg-convert -w 48  -h 48  assets/hmgs_arena_icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72  -h 72  assets/hmgs_arena_icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96  -h 96  assets/hmgs_arena_icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 assets/hmgs_arena_icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 assets/hmgs_arena_icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Paketleri indir ve dogrula
        run: |
          flutter pub get
          flutter pub deps --style=compact > dependency-report.txt

      - name: Statik analiz kalite kapisi
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-report.txt

      - name: Otomatik test kalite kapisi
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-report.txt

      - name: Debug APK derle
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-report.txt
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: APK dosyasini yeniden adlandir
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "HMGS-Arena-build-${{ github.run_number }}.apk"

      - name: APK artifact yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HMGS-Arena-Android-build-${{ github.run_number }}
          path: HMGS-Arena-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Teshis raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HMGS-Arena-CI-reports-${{ github.run_number }}
          path: |
            dependency-report.txt
            analyze-report.txt
            test-report.txt
            build-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Sonuc ozeti
        if: always()
        run: |
          echo "## HMGS Android CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android APK yalnizca analiz ve testler basariliysa yayinlanir." >> "$GITHUB_STEP_SUMMARY"
