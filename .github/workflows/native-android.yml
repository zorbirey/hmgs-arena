name: Native Android CI

on:
  push:
    branches: [ "feat/native-android-v1" ]
    paths: [ "native-android/**", ".github/workflows/native-android.yml" ]
  pull_request:
    paths: [ "native-android/**", ".github/workflows/native-android.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        working-directory: native-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hmgs-arena-native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
